name: Terraform

on:
  pull_request:
    branches: [ main ]
    paths: [ 'envs/**', 'modules/**' ]
  push:
    branches: [ main ]
    paths: [ 'envs/**', 'modules/**' ]
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [ plan, apply, destroy ]
      confirm_destroy:
        description: 'Type "destroy" to confirm'
        required: false

permissions:
  id-token: write # REQUIRED for OIDC
  contents: read

concurrency:
  group: terraform-dev # prevent parallel state modifications (unchanged)
  cancel-in-progress: false

env:
  # === replaces AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY ===
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: "true"
  TF_VAR_db_password: ${{ secrets.DEV_DB_PASSWORD }}
  TF_VAR_jwt_secret: ${{ secrets.DEV_JWT_SECRET }}
  TF_VAR_github_org: ${{ vars.GH_ORG }}

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: envs/dev } }
    steps:
    - uses: actions/checkout@v4
    - uses: azure/login@v2 # replaces configure-aws-credentials
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    - uses: hashicorp/setup-terraform@v3
    - run: terraform fmt -check -recursive
    - run: terraform init
    - run: terraform validate
    - run: terraform plan -out=tfplan
    - uses: actions/upload-artifact@v4
      with: { name: tfplan, path: envs/dev/tfplan }
