name: Terraform

on:
  pull_request:
    branches: [ main ]
    paths: [ 'envs/**', 'modules/**' ]
  push:
    branches: [ main ]
    paths: [ 'envs/**', 'modules/**' ]
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [ plan, apply, destroy ]
      confirm_destroy:
        description: 'Type "destroy" to confirm'
        required: false

permissions:
  id-token: write # REQUIRED for OIDC
  contents: read

concurrency:
  group: terraform-dev # prevent parallel state modifications (unchanged)
  cancel-in-progress: false

env:
  # === replaces AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY ===
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: "true"
  TF_VAR_db_password: ${{ secrets.DEV_DB_PASSWORD }}
  TF_VAR_jwt_secret: ${{ secrets.DEV_JWT_SECRET }}
  TF_VAR_github_org: ${{ vars.GH_ORG }}

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: envs/dev } }
    steps:
    - uses: actions/checkout@v4
    - uses: azure/login@v2 # replaces configure-aws-credentials
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    - uses: hashicorp/setup-terraform@v3
    - run: terraform init
    - run: terraform validate
    - name: Terraform Plan
      id: plan
      run: |
        terraform plan \
          -var="db_password=${{ secrets.DEV_DB_PASSWORD }}" \
          -var="jwt_secret=${{ secrets.DEV_JWT_SECRET }}" \
          -var="github_org=${{ vars.GH_ORG }}" \
          -out=tfplan \
          -no-color
      continue-on-error: true

    - name: Upload plan file
      if: steps.plan.outcome == 'success'
      uses: actions/upload-artifact@v6
      with:
        name: tfplan
        path: envs/dev/tfplan
        retention-days: 1

  # ── Apply ─────────────────────────────────────────────────────────────────
  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: plan
    if: |
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply')
    #environment: dev # ← pauses here and waits for manual approval
    defaults:
      run:
        working-directory: envs/dev

    steps:
    - uses: actions/checkout@v4
    - uses: azure/login@v2 # replaces configure-aws-credentials
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - uses: hashicorp/setup-terraform@v3

    - run: terraform init

    - name: Download plan file
      uses: actions/download-artifact@v7
      with:
        name: tfplan
        path: envs/dev/tfplan

    - name: Terraform Apply
      run: |
        terraform apply \
          -auto-approve \
          -no-color \
          envs/dev/tfplan

  # ── Destroy ───────────────────────────────────────────────────────────────
  destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.action == 'destroy' &&
      github.event.inputs.confirm_destroy == 'destroy'
    environment: dev # ← approval gate for destroy too
    defaults:
      run:
        working-directory: envs/dev

    steps:
    - uses: actions/checkout@v4

    - uses: azure/login@v2 # replaces configure-aws-credentials
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - uses: hashicorp/setup-terraform@v3

    - run: terraform init

    - name: Terraform Destroy
      run: |
        terraform destroy \
          -var="db_password=${{ secrets.DEV_DB_PASSWORD }}" \
          -var="jwt_secret=${{ secrets.DEV_JWT_SECRET }}" \
          -var="github_org=${{ vars.GH_ORG }}" \
          -auto-approve \
          -no-color
